name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --name "FRP-Freedom" --add-data "src;src" --add-data "config.yaml;." main.py

      - name: Verify and archive portable app
        shell: pwsh
        run: |
          $app = "dist/FRP-Freedom/FRP-Freedom.exe"
          if (!(Test-Path $app)) { throw "Packaged executable not found: $app" }
          Compress-Archive -Path "dist/FRP-Freedom" -DestinationPath "dist/FRP-Freedom-Windows.zip" -Force
          $hash = (Get-FileHash "dist/FRP-Freedom-Windows.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  FRP-Freedom-Windows.zip" | Set-Content "dist/FRP-Freedom-Windows.zip.sha256"

      - name: Upload portable Windows package
        uses: actions/upload-artifact@v4
        with:
          name: FRP-Freedom-Windows
          path: |
            dist/FRP-Freedom-Windows.zip
            dist/FRP-Freedom-Windows.zip.sha256
          if-no-files-found: error
          retention-days: 14
          
